# Java release the application is compiled and linked against.
# The reference JDK is Liberica JDK 25 "Full", which bundles the JavaFX modules
# (and, importantly, the JavaFX jmods needed by jlink).
javaLanguageVersion=25

# Only used when the selected JDK does NOT bundle JavaFX (see build.gradle.kts).
javafxVersion=25.0.4

# Version stamped into the jpackage application image.
applicationVersion=0.1.0

org.gradle.parallel=true
org.gradle.caching=true
