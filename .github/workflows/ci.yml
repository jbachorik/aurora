name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Liberica "Full" bundles the JavaFX modules and the jmods that jlink needs,
  # so the project resolves no JavaFX artifacts from a repository.
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: liberica
  JAVA_PACKAGE: jdk+fx

jobs:
  # Runtime images and launchers are platform-specific — a Windows image cannot
  # be produced on macOS — so every platform builds its own. The source is
  # shared; only PlatformServices differs.
  unix-package:
    name: ${{ matrix.platform }} application image
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-aarch64
            launcher: build/app-image/MediaCenter.app/Contents/MacOS/MediaCenter
            runtime: build/app-image/MediaCenter.app/Contents/runtime/Contents/Home/bin/java
          - os: ubuntu-22.04
            platform: linux-x64
            launcher: build/app-image/MediaCenter/bin/MediaCenter
            runtime: build/app-image/MediaCenter/lib/runtime/bin/java
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up Liberica JDK ${{ env.JAVA_VERSION }} Full
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          java-package: ${{ env.JAVA_PACKAGE }}
          cache: gradle

      - name: Test, jlink, jpackage and zip
        run: ./gradlew --no-daemon clean test packageZip

      - name: Check the application image is self-contained and native
        run: |
          set -e
          test -x "${{ matrix.launcher }}" \
            || { echo "::error::launcher missing or not executable: ${{ matrix.launcher }}"; exit 1; }
          test -x "${{ matrix.runtime }}" \
            || { echo "::error::the image does not contain its own Java runtime"; exit 1; }
          # A jlink image only runs on the platform it was linked for, so
          # executing the bundled runtime here proves this artifact was linked
          # with this runner's JDK and not cross-built from somewhere else.
          "${{ matrix.runtime }}" -version
          archive="build/distributions/Aurora-MediaCenter-${{ matrix.platform }}.zip"
          test -f "$archive" || { echo "::error::missing $archive"; exit 1; }
          # The executable bit has to survive archiving or the unzipped image
          # cannot be started at all.
          unzip -l "$archive" > /dev/null
          ls -l "$archive"

      - name: Upload Aurora-MediaCenter-${{ matrix.platform }}
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-MediaCenter-${{ matrix.platform }}
          path: build/distributions/Aurora-MediaCenter-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.platform }}
          path: build/reports/tests/test
          retention-days: 7

  # The deliverable for the target machine. The runner is pinned deliberately.
  windows-package:
    name: windows-x64 application image
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up Liberica JDK ${{ env.JAVA_VERSION }} Full (x64)
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          java-package: ${{ env.JAVA_PACKAGE }}
          architecture: x64
          cache: gradle

      - name: Test, jlink, jpackage and zip
        run: .\gradlew.bat --no-daemon clean test packageZip

      # CI can prove the artifact is structurally valid. It cannot prove
      # Windows 7 compatibility — that is verified by hand on the real laptop.
      - name: Check the application image is self-contained and native
        shell: pwsh
        run: |
          $image = "build/app-image/MediaCenter"
          foreach ($required in @("$image/MediaCenter.exe", "$image/runtime", "$image/app")) {
            if (-not (Test-Path $required)) {
              throw "Missing $required in the application image"
            }
          }
          if (-not (Test-Path "$image/runtime/bin/java.exe")) {
            throw "The application image does not contain its own Java runtime"
          }
          if (-not (Get-ChildItem "$image/runtime" -Filter "glass.dll" -Recurse)) {
            throw "The JavaFX native libraries are missing from the runtime image"
          }
          # A jlink image only runs on the platform it was linked for, so
          # executing the bundled runtime here proves this artifact was linked
          # with this runner's Windows x64 JDK.
          & "$image/runtime/bin/java.exe" -version
          Get-Item build/distributions/Aurora-MediaCenter-windows-x64.zip

      - name: Upload Aurora-MediaCenter-windows-x64
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-MediaCenter-windows-x64
          path: build/distributions/Aurora-MediaCenter-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-windows
          path: build/reports/tests/test
          retention-days: 7
