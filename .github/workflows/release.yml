name: Release

# Two ways in, one pipeline:
#
#   git tag v1.2.3-rc1  →  validate everything, and if it all passes, tag the
#                          same commit v1.2.3 and publish that release
#   git tag v1.2.3      →  validate everything and publish it directly
#   run by hand         →  build the images only, as workflow artifacts, unless
#                          "publish" is ticked while running against a tag
#
# The images attached to a release are the ones that were validated, not a
# rebuild of them.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc*"
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Also create the GitHub release. Only possible when this is run against
          a tag; a manual run otherwise just leaves the images as artifacts.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: liberica
  JAVA_PACKAGE: jdk+fx

jobs:
  # One timestamp for the whole run, so the four artifacts of a run are named
  # alike however many minutes apart their runners happen to start. It lands in
  # the artifact name, which is the file name of the download — telling two
  # builds of the same commit apart is otherwise a matter of remembering which
  # tab they came from.
  stamp:
    name: Stamp the run
    runs-on: ubuntu-22.04
    outputs:
      stamp: ${{ steps.now.outputs.stamp }}
    steps:
      - id: now
        shell: bash
        run: echo "stamp=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

  # Full validation: the whole test suite and a real application image on every
  # platform. A jlink image only runs on the platform it was linked for, so
  # there is no cross-building — each is built on its own runner with its own
  # JDK.
  build:
    name: ${{ matrix.platform }} application image
    needs: stamp
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows uploads the image itself rather than the zip of it: the
          # uploader wraps whatever it is given in a zip of its own, so handing
          # it an archive makes the download a zip inside a zip. The other two
          # cannot do the same — see the upload step.
          - os: windows-2022
            platform: windows-x64
            runtime: build/app-image/MediaCenter/runtime/bin/java.exe
            fxNative: glass.dll
            upload: build/app-image
          # Both macOS architectures: an arm64 image cannot run on an Intel Mac
          # at all, and Rosetta does not help — it translates x86_64 to arm64,
          # not the other way round.
          - os: macos-15
            platform: macos-aarch64
            runtime: build/app-image/MediaCenter.app/Contents/runtime/Contents/Home/bin/java
            fxNative: libglass.dylib
            upload: build/distributions/Aurora-MediaCenter-macos-aarch64.zip
          - os: macos-15-intel
            platform: macos-x64
            runtime: build/app-image/MediaCenter.app/Contents/runtime/Contents/Home/bin/java
            fxNative: libglass.dylib
            upload: build/distributions/Aurora-MediaCenter-macos-x64.zip
          - os: ubuntu-22.04
            platform: linux-x64
            runtime: build/app-image/MediaCenter/lib/runtime/bin/java
            fxNative: libglass.so
            upload: build/distributions/Aurora-MediaCenter-linux-x64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up Liberica JDK ${{ env.JAVA_VERSION }} Full
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          java-package: ${{ env.JAVA_PACKAGE }}
          cache: gradle

      - name: Test, jlink, jpackage and zip
        shell: bash
        run: ./gradlew --no-daemon clean test packageZip

      - name: Check the image is self-contained and native
        shell: bash
        run: |
          set -e
          archive="build/distributions/Aurora-MediaCenter-${{ matrix.platform }}.zip"
          test -f "$archive" || { echo "::error::missing $archive"; exit 1; }
          test -x "${{ matrix.runtime }}" \
            || { echo "::error::the image does not contain its own Java runtime"; exit 1; }
          # A jlink image only runs on the platform it was linked for, so
          # executing the bundled runtime proves this artifact was linked with
          # this runner's JDK rather than cross-built from somewhere else.
          "${{ matrix.runtime }}" -version
          # jlink can link the JavaFX modules without their native libraries if
          # it is pointed at jars rather than jmods, which produces an image
          # that fails only at startup.
          find build/app-image -name "${{ matrix.fxNative }}" | grep -q . \
            || { echo "::error::JavaFX natives (${{ matrix.fxNative }}) missing from the image"; exit 1; }
          ls -l "$archive"

      # macOS and Linux are uploaded as the zip built above, not as the image:
      # the uploader does not preserve the executable bit and resolves the
      # symbolic links inside a .app bundle, either of which lands a broken
      # image on the far end. The extra wrapper is the price of an image that
      # still runs.
      - name: Upload Aurora-MediaCenter-${{ matrix.platform }}
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-MediaCenter-${{ matrix.platform }}-${{ needs.stamp.outputs.stamp }}
          path: ${{ matrix.upload }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.platform }}
          path: build/reports/tests/test
          retention-days: 7

  # Runs only after every platform has passed, so a release never appears with
  # a partial or unvalidated set of images.
  #
  # Promotion and publication happen in the same job on purpose: GitHub does not
  # start a workflow for a tag pushed with GITHUB_TOKEN, so a promoted v1.2.3
  # tag cannot trigger a second run of this workflow. It does not need to — the
  # images were already built and validated above.
  #
  # A manual run builds the images and stops there. Publishing from one is
  # possible — run it against a tag and tick "publish" — but it has to be asked
  # for, so that fetching a build for testing cannot create a release by
  # accident.
  release:
    name: Publish release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the release tag
        id: tag
        shell: bash
        run: |
          set -e
          validated="$GITHUB_REF_NAME"
          # v1.2.3-rc1, v1.2.3-rc.2 and friends all release as v1.2.3.
          release="${validated%%-rc*}"
          echo "validated=$validated" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$validated" = "$release" ]; then
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            echo "Releasing $release directly."
          else
            echo "promoted=true" >> "$GITHUB_OUTPUT"
            echo "$validated passed validation; releasing the same commit as $release."
          fi

      - name: Tag the validated commit as ${{ steps.tag.outputs.release }}
        if: steps.tag.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          release="${{ steps.tag.outputs.release }}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release" > /dev/null 2>&1; then
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release" --jq .object.sha)
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::$release already exists and points at $existing, not $GITHUB_SHA"
              exit 1
            fi
            echo "$release already points at this commit."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$release" \
              -f sha="$GITHUB_SHA" > /dev/null
            echo "Tagged $GITHUB_SHA as $release."
          fi

      - name: Collect the validated application images
        uses: actions/download-artifact@v4
        with:
          pattern: Aurora-MediaCenter-*
          path: images
          merge-multiple: true

      - name: Put the Windows image back into an archive
        shell: bash
        run: |
          set -e
          # It arrives as a folder, because that is what makes its own download a
          # single zip. A release asset has to be an archive, so it is made here
          # from exactly the bytes that were validated — a re-wrap, not a rebuild.
          if [ -d images/MediaCenter ]; then
            (cd images && zip -qr Aurora-MediaCenter-windows-x64.zip MediaCenter && rm -rf MediaCenter)
          fi
          found=$(find images -maxdepth 1 -name '*.zip' | wc -l)
          if [ "$found" -ne 4 ]; then
            echo "::error::expected an archive for each of the four platforms, found $found"
            exit 1
          fi

      - name: Publish ${{ steps.tag.outputs.release }} with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -e
          release="${{ steps.tag.outputs.release }}"
          ls -l images
          if gh release view "$release" > /dev/null 2>&1; then
            gh release upload "$release" images/*.zip --clobber
            echo "Updated the existing $release release."
          else
            # --generate-notes builds the changelog from the commits and merged
            # pull requests since the previous release.
            gh release create "$release" images/*.zip \
              --title "$release" \
              --generate-notes \
              --verify-tag
            echo "Created the $release release."
          fi
